[project]
name = "sub-bot"
version = "0.1.0"
description = "Telegram subscription gate bot for public chats"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.20.0,<4.0.0",
  "sqlalchemy[asyncio]>=2.0.39,<3.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "pydantic-settings>=2.8.1,<3.0.0",
  "structlog>=25.2.0,<26.0.0",
]

[project.scripts]
sub-bot = "sub_bot.main:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
